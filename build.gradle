plugins {
    id 'java'
    id 'eclipse'
    id 'maven'
}

group = 'com.gearforge'
version = '0.1.0'

sourceCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { name = 'forge' url = 'https://maven.minecraftforge.net' }
}

dependencies {
    // Neoforge / Forge mappings for 1.21.1 need to be configured in gradle setup by the user.
}

